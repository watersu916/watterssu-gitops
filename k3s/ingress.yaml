apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: watterssu-ingress
  namespace: portfolio
  annotations:
    argocd.argoproj.io/tracking-id: portfolio-app:networking.k8s.io/Ingress:portfolio/watterssu-ingress
    kubernetes.io/ingress.class: traefik
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - watterssu.com
    secretName: watterssu-tls
  rules:
  - host: watterssu.com
    http:
      paths:
      - backend:
          service:
            name: watterssu-frontend-service
            port:
              number: 80
        path: /
        pathType: Prefix
